  - case analysis
  - legal drafting
  - compliance
red_flags:
  - Lists legal subjects without showing research, drafting, casework, or advisory experience
  - Claims litigation, counsel, or compliance responsibility without evidence in the CV
guidance:
  - Prefer evidence from moot courts, internships, legal clinics, case research, contracts, and published work.
  - Keep legal terminology faithful to the source and do not infer licenses or authority to practise law.
  - Treat Vietnamese and English equivalents as the same competency when checking missing keywords.
