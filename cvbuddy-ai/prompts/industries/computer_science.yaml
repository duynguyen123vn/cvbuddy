red_flags:
  - Lists technologies without projects, responsibilities, implementation details, or results
  - Claims production deployment, optimization, or security expertise without source evidence
guidance:
  - Prefer project-backed evidence, repositories, datasets, model evaluation, security labs, and technical outcomes.
  - Do not convert coursework or currently learning items into demonstrated professional experience.
  - Treat Vietnamese and English equivalents as the same competency when checking missing keywords.
