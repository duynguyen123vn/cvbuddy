slug: computer_science
display_name: Công nghệ thông tin / Computer Science & IT
core_keywords:
  - lập trình
  - thuật toán
  - cấu trúc dữ liệu
  - kỹ thuật phần mềm
  - cơ sở dữ liệu
  - kiểm thử
  - programming
  - algorithms
  - data structures
  - software engineering
  - database
  - Git
  - testing
red_flags:
  - Lists technologies without projects, responsibilities, implementation details, or results
  - Claims production deployment, optimization, or security expertise without source evidence
guidance:
  - Prefer project-backed evidence, repositories, architecture decisions, database design, testing, deployment, and technical outcomes.
  - Do not convert coursework or currently learning items into demonstrated professional experience.
  - Treat Vietnamese and English equivalents as the same competency when checking missing keywords.
  - AI-specific CVs should use the AI / Software Engineering group unless the target is a general IT role.
