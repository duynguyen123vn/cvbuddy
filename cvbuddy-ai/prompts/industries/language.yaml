slug: language
display_name: Ngôn ngữ / Languages
core_keywords:
  - ngoại ngữ
  - giao tiếp liên văn hóa
  - biên phiên dịch
  - giao tiếp
  - English
  - Chinese
  - Japanese
  - Korean
  - translation
  - interpretation
  - communication
  - cross-cultural communication
red_flags:
  - Chỉ liệt kê trình độ ngoại ngữ nhưng không có hoạt động, dự án, trợ giảng, biên dịch, giao tiếp khách hàng, hoặc bối cảnh sử dụng ngôn ngữ
  - Tự nhận năng lực biên phiên dịch/giảng dạy mà không có học phần, hoạt động, chứng chỉ, hoặc kinh nghiệm hỗ trợ tương ứng
guidance:
  - Chuyên ngành ngôn ngữ phải phản ánh ngành học hoặc năng lực ngôn ngữ chính, không phải nơi thực tập.
  - Trung tâm Anh ngữ, khách sạn, du lịch, văn phòng, và chăm sóc khách hàng là mục tiêu thực tập/career target, không phải vertical chính.
  - Đánh giá cả năng lực ngôn ngữ, hoạt động học thuật, chứng chỉ, giao tiếp, biên dịch, trợ giảng, và trải nghiệm làm việc liên quan.
