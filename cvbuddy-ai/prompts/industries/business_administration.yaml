slug: business_administration
display_name: Quản trị kinh doanh / Business Administration
core_keywords:
  - business strategy
  - operations
  - stakeholder management
  - data analysis
  - communication
  - KPI
red_flags:
  - Lists business concepts or platforms without role, scope, outcome, or supporting evidence
  - Uses revenue, growth, cost saving, or conversion claims without source-backed measurements
guidance:
  - Match the CV against the selected vertical instead of treating all business disciplines as interchangeable.
  - Prefer measurable outcomes when present, but never invent revenue, conversion, cost, or customer metrics.
  - Treat Vietnamese and English equivalents as the same competency when checking missing keywords.
