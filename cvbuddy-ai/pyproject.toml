[project]
name = "cvbuddy-ai"
version = "0.1.0"
description = "CVBuddy AI microservice: local preprocess, context matrix, LLM, structured JSON"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
