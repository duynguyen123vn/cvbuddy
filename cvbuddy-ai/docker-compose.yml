services:
  ai:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./prompts:/app/prompts
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
